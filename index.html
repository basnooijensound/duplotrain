<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#126cc7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DUPLO Machinist</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <img id="scene" src="assets/train_panel.png" alt="">
  <div id="controlBand"></div>

  <button id="home" aria-label="Opnieuw verbinden">
    <svg viewBox="0 0 24 24"><path d="M12 3 2.5 11h2.3v9h5.1v-5.7h4.2V20h5.1v-9h2.3L12 3z"/></svg>
  </button>

  <button id="bt" aria-label="Bluetooth verbinden">
    <span id="btDot"></span>
    <svg viewBox="0 0 24 24"><path d="m12 2 6 5-4.2 5L18 17l-6 5V14.4L7.5 19 6 17.5l5.2-5.5L6 6.5 7.5 5l4.5 4.6V2zm2 4.3v3.4L16 7l-2-1.7zm0 8v3.4L16 17l-2-2.7z"/></svg>
  </button>

  <button id="frontLamp" class="lampHotspot" aria-label="Lamp"></button>
  <button id="chimneyLamp" class="lampHotspot" aria-label="Lamp"></button>
  <div id="lampGlowFront"></div><div id="lampGlowTop"></div>

  <div id="speedBox">
    <div id="speedTrack">
      <span class="dir left"></span><span class="dir right"></span>
      <div id="knob"></div>
      <input id="speedInput" type="range" min="-100" max="100" value="0" step="1" aria-label="Snelheid">
    </div>
  </div>

  <button id="horn" class="bigBtn" aria-label="Toeter">
    <svg class="btnIcon" viewBox="0 0 100 100"><path d="M15 44h20l30-20v52L35 56H15z"/><path d="M68 39q14 11 0 22M76 30q28 20 0 40" fill="none" stroke-linecap="round"/></svg>
  </button>
  <button id="stop" class="bigBtn" aria-label="Stop">
    <svg class="btnIcon" viewBox="0 0 100 100"><path d="M30 55V26c0-8 12-8 12 0v24-31c0-8 12-8 12 0v29-25c0-8 12-8 12 0v29-17c0-8 12-8 12 0v28c0 20-14 31-32 31-16 0-25-8-31-21L7 54c-4-10 8-15 13-7l10 15z"/></svg>
  </button>

  <div id="toast"></div>
  <div id="unsupported">Deze browser ondersteunt Web Bluetooth niet. Open deze pagina op de Android-tablet in Google Chrome.</div>
</div>
<script src="app.js"></script>
</body>
</html>
